apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-services
  template:
    metadata:
      labels:
        app: employee-services
    spec:
      containers:
        - name: employee-service
          image: haripriya1310/nodejs2-backend:v1
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: employee-services
spec:
  selector:
    app: employee-services
  ports:
    - port: 80
      targetPort: 3000
  type: NodePort
